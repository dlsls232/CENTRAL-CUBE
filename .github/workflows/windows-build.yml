name: Windows build and tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build executables and run tests
        shell: cmd
        run: scripts\\build_windows.bat
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer\\CentralCube.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows binaries and installer
        uses: actions/upload-artifact@v4
        with:
          name: CENTRAL-CUBE-Windows-${{ github.sha }}
          path: |
            dist/CentralCube/
            dist/CentralCubeAgent/
            dist-installer/*.exe
          if-no-files-found: error
          retention-days: 30
